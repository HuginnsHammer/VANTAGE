[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantage-security"
version = "0.2.0"
description = "Evidence-led security exposure management and validation platform"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "dnspython>=2.6,<3"]
auth = ["PyJWT[crypto]>=2.9,<3", "dnspython>=2.6,<3"]
postgres = ["sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "PyJWT[crypto]>=2.9,<3"]

[project.scripts]
vantage = "vantage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/vantage/persistence/postgres.py" = ["E501"]
